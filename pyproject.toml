[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runform"
version = "0.1.0"
description = "RunForm: Video-Based Running Form Analysis Using Pose Estimation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Varun Bhonslay" }]
keywords = [
    "pose-estimation",
    "gait-analysis",
    "sports-computer-vision",
    "running",
    "yolov8",
    "injury-prevention",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
